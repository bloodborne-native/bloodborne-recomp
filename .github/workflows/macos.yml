# Builds the recompiler's tools on Apple Silicon against bbcpu's main branch: every push to main and
# every pull request. bbcpu runs its own CPU tests.
name: macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15 # Apple Silicon
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Homebrew's clang, as on the maintainer's Mac: Apple's clang compiles the x86-64 test guest
      # with AVX instructions bbcpu does not implement (the game does not use them).
      - name: Tools
        run: |
          brew install ninja llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          /usr/bin/pgrep -q oahd || softwareupdate --install-rosetta --agree-to-license

      - name: Zydis cache
        uses: actions/cache@v4
        with:
          path: deps
          key: zydis-v4.1.1-${{ runner.os }}-${{ runner.arch }}

      - name: bbcpu
        run: git clone --depth 1 https://github.com/bloodborne-native/bbcpu.git ../bbcpu

      - name: Build
        run: bash build.sh
